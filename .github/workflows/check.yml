name: Check
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: python -m pip install -r backend/requirements-dev.txt
      - run: python -m unittest discover -s backend/tests -v
      - run: python -m backend.app.brief backend/data/fixtures/synthetic_day.csv
      - run: POSTGRES_PASSWORD=ci-test-password docker compose config --quiet
      - name: Initialize a volume with the pre-profile schema
        env:
          POSTGRES_PASSWORD: ci-test-password
        run: |
          docker compose up --wait db
          docker compose exec -T db psql -U cleanair -Atc "SELECT to_regclass('households') IS NULL" | grep -qx t
          docker compose down
      - run: POSTGRES_PASSWORD=ci-test-password docker compose up --build --wait
      - name: Verify household profiles against the upgraded PostgreSQL volume
        env:
          POSTGRES_PASSWORD: ci-test-password
        run: |
          db_ip=$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' "$(docker compose ps -q db)")
          export TEST_DATABASE_URL="postgresql://cleanair:ci-test-password@${db_ip}/cleanair"
          python -m unittest backend.tests.test_households backend.tests.test_grap backend.tests.test_commute backend.tests.test_saathi -v
          python - <<'PYTHON'
          import subprocess
          import httpx
          from backend.tests.test_households import PROFILE, token

          with httpx.Client(base_url="http://localhost:8000", headers=token()) as client:
              saved = client.post("/households", json=PROFILE).raise_for_status().json()
              subprocess.run(["docker", "compose", "down"], check=True)
              subprocess.run(["docker", "compose", "up", "--wait"], check=True)
              assert client.get("/households/me").raise_for_status().json() == saved
              assert client.delete("/households/" + saved["id"]).status_code == 204
          PYTHON
          db_ip=$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' "$(docker compose ps -q db)")
          export TEST_DATABASE_URL="postgresql://cleanair:ci-test-password@${db_ip}/cleanair"
          python -m pip install coverage==7.10.7
          python -m coverage run --source=backend/app/engine -m unittest discover -s backend/tests -q
          python -m coverage report --show-missing --fail-under=80
      - run: curl --fail http://localhost:8000/health
      - run: curl --fail 'http://localhost:8000/air/now?lat=28.61&lon=77.21'
      - name: Exercise the mobile fixture dashboard in Chrome
        env:
          CHROME_BIN: /usr/bin/google-chrome
          AXE_SCRIPT: /tmp/saathi-axe/node_modules/axe-core/axe.min.js
        run: |
          python -m pip install playwright==1.58.0
          npm install --prefix /tmp/saathi-axe --no-audit --no-fund --ignore-scripts axe-core@4.10.3
          python frontend/smoke.py
      - name: Probe the live Delhi feed
        continue-on-error: true
        run: |
          DATA_MODE=live python -m uvicorn backend.app.main:app --port 8001 > /tmp/delhi-feed.log 2>&1 &
          server=$!
          trap 'kill "$server" || true' EXIT
          curl -fsS --retry 12 --retry-all-errors --retry-delay 2 --max-time 5 \
            http://127.0.0.1:8001/air/forecast > /tmp/delhi-forecast.json
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("/tmp/delhi-forecast.json").read_text())
          assert data["data_mode"] == "live" and data["available_hours"] == 48
          assert data["stale"] is False
          print("CAMS download at", data["fetched_at"], "provided 48 hourly estimates")
          PY
      - if: always()
        run: docker compose logs
        env:
          POSTGRES_PASSWORD: ci-test-password
      - if: always()
        run: docker compose down --volumes
        env:
          POSTGRES_PASSWORD: ci-test-password

  deployment:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cleanair
          POSTGRES_PASSWORD: ci-test-password
          POSTGRES_DB: cleanair
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cleanair -d cleanair"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the public deployment image
        run: docker build -t cleanair-deployment .
      - name: Start on a platform-supplied port with automatic migrations
        run: |
          docker run -d --name saathi-deployment --network host \
            -e DATABASE_URL=postgresql://cleanair:ci-test-password@127.0.0.1:5432/cleanair \
            -e DATA_MODE=fixture -e PORT=8080 cleanair-deployment
          curl --fail --retry 20 --retry-connrefused --retry-all-errors \
            --retry-delay 1 --max-time 5 http://127.0.0.1:8080/health/ready
      - name: Exercise the same-origin production dashboard
        env:
          UI_URL: http://127.0.0.1:8080
          CHROME_BIN: /usr/bin/google-chrome
        run: |
          python -m pip install -r backend/requirements-dev.txt playwright==1.58.0
          python frontend/smoke.py
      - name: Verify storage survives a production container restart
        run: |
          python - <<'PYTHON'
          import json
          import os
          from pathlib import Path
          import httpx
          from backend.tests.test_households import PROFILE, token

          headers = token()
          with httpx.Client(base_url="http://127.0.0.1:8080/api", headers=headers) as client:
              saved = client.post("/households", json=PROFILE).raise_for_status().json()
          state = {"headers": headers, "profile": saved}
          (Path(os.environ["RUNNER_TEMP"]) / "saathi-deployment-profile.json").write_text(json.dumps(state))
          PYTHON
          docker restart saathi-deployment
          curl --fail --retry 20 --retry-connrefused --retry-all-errors \
            --retry-delay 1 --max-time 5 http://127.0.0.1:8080/health/ready
          python - <<'PYTHON'
          import json
          import os
          from pathlib import Path
          import httpx

          path = Path(os.environ["RUNNER_TEMP"]) / "saathi-deployment-profile.json"
          state = json.loads(path.read_text())
          with httpx.Client(base_url="http://127.0.0.1:8080/api", headers=state["headers"]) as client:
              assert client.get("/households/me").raise_for_status().json() == state["profile"]
              client.delete("/households/" + state["profile"]["id"]).raise_for_status()
          path.unlink()
          PYTHON
      - if: always()
        run: docker logs saathi-deployment
      - if: always()
        run: docker rm -f saathi-deployment
