name: Check
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: python -m pip install -r backend/requirements-dev.txt
      - run: python -m unittest discover -s backend/tests -v
      - run: python -m backend.app.brief backend/data/fixtures/synthetic_day.csv
      - run: POSTGRES_PASSWORD=ci-test-password docker compose config --quiet
      - run: POSTGRES_PASSWORD=ci-test-password docker compose up --build --wait
      - run: curl --fail http://localhost:8000/health
      - run: curl --fail 'http://localhost:8000/air/now?lat=28.61&lon=77.21'
      - name: Probe the live Delhi feed
        continue-on-error: true
        run: |
          DATA_MODE=live python -m uvicorn backend.app.main:app --port 8001 > /tmp/delhi-feed.log 2>&1 &
          server=$!
          trap 'kill "$server" || true' EXIT
          curl -fsS --retry 12 --retry-all-errors --retry-delay 2 --max-time 5 \
            http://127.0.0.1:8001/air/forecast > /tmp/delhi-forecast.json
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("/tmp/delhi-forecast.json").read_text())
          assert data["data_mode"] == "live" and data["available_hours"] == 48
          assert data["stale"] is False
          print("CAMS download at", data["fetched_at"], "provided 48 hourly estimates")
          PY
      - if: always()
        run: docker compose logs
        env:
          POSTGRES_PASSWORD: ci-test-password
      - if: always()
        run: docker compose down --volumes
        env:
          POSTGRES_PASSWORD: ci-test-password
