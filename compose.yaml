services:
  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      backend:
        condition: service_healthy
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      PGHOST: db
      PGDATABASE: cleanair
      PGUSER: cleanair
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      DATA_MODE: ${DATA_MODE:-fixture}
      CORS_ORIGINS: http://localhost:5173
    depends_on:
      db:
        condition: service_healthy
    command: ["sh", "-ec", "python -m backend.db.migrate && exec uvicorn backend.app.main:app --host 0.0.0.0 --port 8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: cleanair
      POSTGRES_USER: cleanair
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/db/init.sql:/docker-entrypoint-initdb.d/01-vector.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cleanair -d cleanair"]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  postgres_data:
